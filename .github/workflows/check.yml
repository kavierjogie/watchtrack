# Runs the same gate as `npm run check` (lint, typecheck, tests, build) on every push and pull request, so a broken
# build is caught before Vercel deploys it and the service worker caches it on users' devices.
name: Check

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Pinned to full commit SHAs so a moved tag can't change what runs. Dependabot (.github/dependabot.yml) bumps them.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The job only reads the code: don't leave the token in .git/config for later steps.
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
