    <meta name="theme-color" content="#0b0b12" />

    <meta name="google-site-verification" content="9CP-3yl4ab5EmtR8dk0jrDfR7YeiMbLQsz9DDWv28qk" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="WatchTrack" />
    <meta property="og:title" content="WatchTrack — Track Anime, TV Shows & Movies" />
    <meta property="og:description" content="One watchlist for anime, TV series and movies. Always know the next episode to watch. No sign-up; your library stays in your browser." />

    <meta property="og:image" content="https://watchtrack-eta.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="WatchTrack: always know the next episode" />

    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "@id": "https://watchtrack-eta.vercel.app/#website",
            "name": "WatchTrack",
            "url": "https://watchtrack-eta.vercel.app/"
          },
          {
            "@type": "WebApplication",
            "name": "WatchTrack",
            "url": "https://watchtrack-eta.vercel.app/",
            "description": "A watchlist and episode tracker for anime, TV series and movies. Tracks season and episode progress, organises titles into Watching, Plan to Watch, On Hold, Completed and Dropped, and stores the library in the browser on the user's device.",
            "applicationCategory": "EntertainmentApplication",
            "operatingSystem": "Any (runs in a modern web browser; installable as a PWA)",
            "browserRequirements": "Requires JavaScript and IndexedDB",
            "isAccessibleForFree": true,
            "featureList": [
              "Track anime, TV series and movies in one library",
              "Season and episode progress with one-tap Watched",
              "Overall or per-season episode numbering",
              "Watching, Plan to Watch, On Hold, Completed and Dropped lists",
              "Upcoming episode and new season alerts",
              "Read-only share links",
              "Optional sync to your own Google Drive",
              "Backup files to save your library and move it to another device",
              "Works offline once loaded"
            ],
            "isPartOf": { "@id": "https://watchtrack-eta.vercel.app/#website" }
          }
        ]
      }

    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
